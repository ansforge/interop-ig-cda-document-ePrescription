name: Workflow CI-build (GitHub pages)
on:
  workflow_call:
  push:
  workflow_dispatch:

# Annule tout run ci-build précédent encore en cours sur la même branche/PR
# dès qu'un nouveau push arrive, pour économiser des minutes GitHub Actions.
concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-sushi-tests_gitHubPages:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ansforge/fhir-ig-builder:latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: igSource
      - uses: ansforge/IG-workflows@main
        with:
          repo_ig: "./igSource"
          github_page: "true"
          github_page_token: ${{ secrets.GITHUB_TOKEN }}
          bake: "false"
          validator_cli: "false"
          generate_testscript: "false"
          generate_plantuml: "false"
          container_mode: "true"

      # Causes détaillées des slices non reconnues, extraites des blocs "Show Reasoning" du rapport QA
      # et ajoutées sous chaque erreur dans qa.html / qa.min.html. Aussi affichées dans le résumé du run.
      # if: always() pour avoir l'analyse même si le build échoue.
      - name: 🔎 Causes détaillées dans la page QA
        id: qa-causes
        if: always()
        shell: bash
        run: |
          out=igSource/output
          if [ -f "$out/qa.html" ]; then
            node igSource/scripts/qa-reasoning.js "$out/qa.html" --inject > qa-causes.txt
            mkdir -p qa_publish/ig
            cp "$out/qa.html" qa_publish/ig/
            if [ -f "$out/qa.min.html" ]; then
              node igSource/scripts/qa-reasoning.js "$out/qa.min.html" --inject > /dev/null
              cp "$out/qa.min.html" qa_publish/ig/
            fi
            {
              echo "## Causes des slices non reconnues"
              echo '```'
              head -c 900000 qa-causes.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # L'action ci-dessus a déjà publié l'IG sur gh-pages : on republie uniquement les pages QA
      # enrichies par-dessus, dans le dossier de la branche, sans toucher au reste (keep_files).
      - name: 🚀 Publication de la page QA enrichie
        if: success() && steps.qa-causes.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./qa_publish
          destination_dir: ${{ github.head_ref || github.ref_name }}
          keep_files: true
          commit_message: "page QA enrichie : ${{ github.event.head_commit.message }}"

      - name: 📋 Upload qa-causes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-causes
          path: qa-causes.txt
          if-no-files-found: ignore
